<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیگنال طلا (آزمایشی)</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#2a2618;--mu:#7a7260;--bd:#e6dfcc;--gold:#b8860b;--buy:#1a8a4a;--sell:#c93a3a;--hold:#8a7a3a;--warn:#fff3cd;--warntx:#664d03}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#221f16;--tx:#f1ead6;--mu:#a69f8a;--bd:#3a3526;--gold:#e0b440;--buy:#3ccf7a;--sell:#ff6b6b;--hold:#d9c26a;--warn:#3d3410;--warntx:#f0dc8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:16px;max-width:560px;margin:auto;line-height:1.7}
h1{font-size:20px;margin:0 0 4px;color:var(--gold)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.w{background:var(--warn);color:var(--warntx);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
#sig{text-align:center;font-size:30px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
.b{color:var(--buy)}.s{color:var(--sell)}.h{color:var(--hold)}
.n{font-size:12px;color:var(--mu)}
.lv{display:flex;gap:8px;text-align:center;margin-top:10px}
.lv div{flex:1;background:var(--bg);border-radius:10px;padding:8px;font-size:13px}
.lv b{display:block;font-size:16px;direction:ltr}
#liveP{font-size:26px;direction:ltr;display:inline-block}
.big{font-size:20px;font-weight:bold}
.st{display:flex;gap:8px;text-align:center}
.st div{flex:1;background:var(--bg);border-radius:10px;padding:8px;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:18px;color:var(--tx)}
</style>
</head>
<body>
<h1>📈 سیگنال طلا</h1>
<div class="n" id="up">در حال بارگذاری...</div>
<div class="w" id="test" style="display:none;margin-top:10px"></div>
<div class="w" id="err" style="display:none">⚠️ آخرین اجرای ربات خطا داشت؛ سیگنال نمایش‌داده‌شده ممکن است قدیمی باشد.</div>

<div class="c" style="margin-top:12px;text-align:center">
قیمت لحظه‌ای اسپات<br><b id="liveP">...</b>
<div class="n" id="liveT"></div>
</div>

<div class="c">
<div id="sig">...</div>
<div id="sc" class="n" style="text-align:center"></div>
<div class="lv" id="lv"></div>
<div class="n" id="why" style="margin-top:8px;text-align:center"></div>
</div>

<div class="c">
<div class="n" style="margin-bottom:6px">آمار سیگنال‌های منتشرشده (آزمایشی)</div>
<div class="st">
<div>تعداد<b id="stN">-</b></div><div>نرخ برد<b id="stW">-</b></div><div>مجموع R<b id="stR">-</b></div>
</div>
<div class="n" id="last" style="margin-top:8px"></div>
</div>

<div class="c" style="padding:0;overflow:hidden">
<div class="tradingview-widget-container" style="height:420px;width:100%">
<div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
{"autosize":true,"symbol":"OANDA:XAUUSD","interval":"15","timezone":"Asia/Tehran","theme":"light","style":"1","locale":"en","allow_symbol_change":false,"hide_side_toolbar":true,"support_host":"https://www.tradingview.com"}
</script>
</div>
</div>

<div class="c" id="det"></div>
<p class="n" id="disc"></p>

<script>
var REASONS={no_data:"داده‌ی کافی نیست",market_closed:"بازار بسته است",no_session:"خارج از سشن لندن/نیویورک",news_blackout:"بازه‌ی خبر (بلک‌اوت)",volatility_spike:"نوسان بیش‌ازحد کندل",open_signal:"یک سیگنال باز وجود دارد",cooldown:"کول‌داون بعد از ضرر",weak_trend:"روند به‌اندازه‌ی کافی قوی نیست",low_adx:"ADX پایین یا جهت DI ناسازگار",no_pullback:"پولبک کامل نشده",no_trigger:"تریگر ورود دیده نشد",sl_too_wide:"حد ضرر بیش‌ازحد بزرگ"};
var SIDE={BUY:"🟢 خرید",SELL:"🔴 فروش"};
function el(i){return document.getElementById(i)}
function num(x,d){return (x===null||x===undefined||isNaN(x))?"-":Number(x).toFixed(d===undefined?2:d)}
function fa(t){return new Date(t).toLocaleString("fa-IR",{timeZone:"Asia/Tehran",hour12:false})}

function live(){
  fetch("https://api.gold-api.com/price/XAU").then(function(r){return r.json()}).then(function(d){
    var p=Number(d.price); if(!(p>0))throw 0;
    el("liveP").textContent=p.toFixed(2);
    el("liveT").textContent=new Date().toLocaleTimeString("fa-IR");
  }).catch(function(){el("liveT").textContent="خطا در دریافت قیمت لحظه‌ای"});
}

function parseCSV(t){
  var L=t.trim().split("\n"); if(L.length<2)return [];
  var H=L[0].split(","),out=[];
  for(var i=1;i<L.length;i++){var c=L[i].split(","),o={};for(var j=0;j<H.length;j++)o[H[j]]=c[j];out.push(o)}
  return out;
}

function showStats(rows){
  var pub=rows.filter(function(r){return r.delivery==="sent"});
  var done=pub.filter(function(r){return r.status==="TP"||r.status==="SL"||r.status==="EXPIRED"});
  var win=done.filter(function(r){return r.status==="TP"}).length;
  var R=done.reduce(function(a,r){return a+(parseFloat(r.result_r)||0)},0);
  el("stN").textContent=done.length;
  el("stW").textContent=done.length?Math.round(win*100/done.length)+"٪":"-";
  el("stR").textContent=done.length?(R>=0?"+":"")+R.toFixed(2):"-";
  var last=pub[pub.length-1];
  el("last").textContent=last?("آخرین سیگنال: "+(SIDE[last.side]||last.side)+" — "+fa(last.time_utc)+" — "+
    (last.status==="OPEN"?"باز":last.status+" ("+(parseFloat(last.result_r)>=0?"+":"")+num(last.result_r)+"R)")):"هنوز سیگنالی منتشر نشده است.";
}

function showSignal(d){
  var S=d.status, why=el("why");
  if(S==="BUY"||S==="SELL"){
    el("sig").textContent=SIDE[S]; el("sig").className=(S==="BUY"?"b":"s");
    el("sc").textContent="ورود تقریبی (قیمت بازار) — "+fa(d.time_utc)+(d.delayed_minutes>0?" — تأخیر "+d.delayed_minutes+" دقیقه":"");
    var h='';
    if(d.entry!==null&&d.entry!==undefined){h+='<div>ورود (تقریبی)<b>'+num(d.entry)+'</b></div>';}
    h+='<div>تارگت<b class="b">'+(d.tp!==null?num(d.tp):num(d.tp_distance)+'$')+'</b></div>';
    h+='<div>حد ضرر<b class="s">'+(d.sl!==null?num(d.sl):num(d.sl_distance)+'$')+'</b></div>';
    el("lv").innerHTML=h;
    why.textContent=(d.sl===null?"فاصله‌ها بر حسب دلار از قیمت ورود هستند. ":"")+"نسبت ریسک به ریوارد 1 به "+num(d.r,1);
  }else{
    el("sig").textContent="🟡 سیگنالی نیست"; el("sig").className="h";
    el("sc").textContent=REASONS[d.reason]||d.reason||"";
    el("lv").innerHTML="";
    why.textContent="سیگنال نبودن عادی است؛ استراتژی فقط در شرایط مشخص و کم‌تعداد سیگنال می‌دهد.";
  }
}

function showDetails(d){
  var h='';
  h+='<div class="row"><span>ATR (M15)</span><b>'+num(d.atr)+'$</b></div>';
  h+='<div class="row"><span>ADX</span><b>'+num(d.adx,1)+'</b></div>';
  h+='<div class="row"><span>قیمت بالای EMA200</span><b>'+(d.above_ema200===null?"-":(d.above_ema200?"بله":"خیر"))+'</b></div>';
  h+='<div class="row"><span>نوع داده</span><b>'+(d.source_type==="FUTURES"?"فیوچرز (تقریبی)":"اسپات")+'</b></div>';
  h+='<div class="row"><span>حالت</span><b>'+(d.mode==="TEST"?"آزمایشی":"زنده")+'</b></div>';
  if(d.news_file_stale)h+='<div class="n" style="margin-top:6px">⚠️ فایل اخبار دستی به‌روز نیست؛ فقط بازه‌های ثابت خبری اعمال می‌شود.</div>';
  el("det").innerHTML=h;
}

function load(){
  fetch("signal.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    showSignal(d); showDetails(d);
    el("disc").textContent=d.disclaimer||"";
    if(d.mode==="TEST"){el("test").style.display="block";el("test").textContent="🧪 حالت آزمایشی — "+(d.disclaimer||"")}
    var age=Math.round((Date.now()-new Date(d.generated_at))/60000);
    el("up").textContent="آخرین تغییر داده‌ی سیگنال: "+fa(d.generated_at)+
      ((age>180&&d.reason!=="market_closed")?" — ممکن است ربات متوقف شده باشد":"");
  }).catch(function(){el("up").textContent="هنوز signal.json ساخته نشده یا قابل خواندن نیست."});
  fetch("signals_log.csv?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){showStats(parseCSV(t))}).catch(function(){showStats([])});
  fetch("error.json?t="+Date.now()).then(function(r){el("err").style.display=r.ok?"block":"none"}).catch(function(){});
}
live();setInterval(live,10000);
load();setInterval(load,60000);
</script>
</body>
</html>
