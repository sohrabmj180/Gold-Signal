<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیگنال طلا</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#2a2618;--mu:#7a7260;--bd:#e6dfcc;--gold:#b8860b;--buy:#1a8a4a;--sell:#c93a3a;--hold:#8a7a3a}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#221f16;--tx:#f1ead6;--mu:#a69f8a;--bd:#3a3526;--gold:#e0b440;--buy:#3ccf7a;--sell:#ff6b6b;--hold:#d9c26a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:16px;max-width:560px;margin:auto;line-height:1.6}
h1{font-size:20px;margin:0 0 4px;color:var(--gold)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
#sig{text-align:center;font-size:30px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
.b{color:var(--buy)}.s{color:var(--sell)}.h{color:var(--hold)}
.n{font-size:12px;color:var(--mu)}
svg{width:100%;height:auto;display:block}
.lv{display:flex;gap:8px;text-align:center;margin-top:10px}
.lv div{flex:1;background:var(--bg);border-radius:10px;padding:8px;font-size:13px}
.lv b{display:block;font-size:16px;direction:ltr}
</style>
</head>
<body>
<h1>📈 سیگنال لحظه‌ای طلا</h1>
<div class="n" id="up">در حال بارگذاری...</div>
<div class="c" style="margin-top:12px">
<div id="sig">...</div>
<div id="sc" class="n" style="text-align:center"></div>
<div class="lv" id="lv"></div>
</div>
<div class="c" id="det"></div>
<div class="c"><svg id="ch" viewBox="0 0 400 180"></svg>
<div class="n">طلایی: قیمت، آبی: EMA20، بنفش: EMA50</div></div>
<p class="n">فقط ابزار تحلیلی است و توصیه‌ی مالی نیست. داده ممکن است چند دقیقه تأخیر داشته باشد. قبل از معامله بک‌تست کنید.</p>
<script>
var T=function(x){return x>0?"خرید":x<0?"فروش":"خنثی"},C=function(x){return x>0?"b":x<0?"s":"h"};
function load(){
fetch("signal.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
var S={BUY:["🟢 خرید","b"],SELL:["🔴 فروش","s"],HOLD:["🟡 صبر کنید","h"]}[d.signal];
var e=document.getElementById("sig");e.textContent=S[0];e.className=S[1];
document.getElementById("sc").textContent="قیمت: "+d.price+" — امتیاز: "+d.score+" از ۳";
document.getElementById("lv").innerHTML=d.signal==="HOLD"?"":
'<div>ورود<b>'+d.entry+'</b></div><div>تارگت<b class="b">'+d.tp+'</b></div><div>حد ضرر<b class="s">'+d.sl+'</b></div>';
var m=Math.round((Date.now()-new Date(d.updated))/60000);
document.getElementById("up").textContent="آخرین بروزرسانی: "+m+" دقیقه پیش"+(m>30?" (قدیمی است، بازار ممکن است بسته باشد)":"");
document.getElementById("det").innerHTML=
'<div class="row"><span>EMA20 / EMA50 ('+d.ema20+' / '+d.ema50+')</span><b class="'+C(d.votes[0])+'">'+T(d.votes[0])+'</b></div>'+
'<div class="row"><span>RSI = '+d.rsi+'</span><b class="'+C(d.votes[1])+'">'+T(d.votes[1])+'</b></div>'+
'<div class="row"><span>MACD هیستوگرام = '+d.hist+'</span><b class="'+C(d.votes[2])+'">'+T(d.votes[2])+'</b></div>'+
'<div class="n" style="margin-top:6px">ATR = '+d.atr+' (حد ضرر ۱٫۵ و تارگت ۳ برابر ATR)</div>';
var N=d.closes.length,all=d.closes.concat(d.e20,d.e50),mn=Math.min.apply(0,all),mx=Math.max.apply(0,all);
var pl=function(a,c,w){var s="";for(var i=0;i<N;i++)s+=(i*400/(N-1)).toFixed(1)+","+(170-(a[i]-mn)/(mx-mn||1)*160).toFixed(1)+" ";
return '<polyline fill="none" stroke="'+c+'" stroke-width="'+w+'" points="'+s+'"/>'};
document.getElementById("ch").innerHTML=pl(d.closes,"#d4a017",2)+pl(d.e20,"#3b82f6",1.4)+pl(d.e50,"#a855f7",1.4);
}).catch(function(){document.getElementById("up").textContent="هنوز signal.json ساخته نشده. در تب Actions گردش کار را یک بار اجرا کنید."});
}
load();setInterval(load,60000);
</script>
</body>
</html>
